<header class="workspace-header" (keydown.escape)="closeMenus()">
 <div class="workspace-bar">
  <a class="brand-link" [routerLink]="homeRoute" aria-label="Company home" (click)="closeMenus()"><app-company-logo *ngIf="data?.companyId; else productBrand" [text]="data.companyId.name" [letters]="data.companyId.logoText" [compact]="true"></app-company-logo><ng-template #productBrand><span class="product-symbol">CN</span><strong>CargoNest</strong></ng-template></a>
  <nav id="workspace-navigation" class="compact-navigation" [class.mobile-open]="mobileOpen" aria-label="Main navigation"><ul class="navigation-list"><li *ngFor="let item of model; let index = index" class="navigation-item" [class.group-active]="groupActive(item)">
   <a *ngIf="!item.items" class="navigation-link" [routerLink]="item.routerLink" [fragment]="item.fragment" [class.active]="linkActive(item)" (click)="closeMenus()"><i [class]="item.icon || 'pi pi-th-large'" aria-hidden="true"></i>{{menuLabel(item.label)}}</a>
   <button *ngIf="item.items" type="button" class="navigation-link" [class.expanded]="openMenu === index" (click)="toggleMenu(index)" [attr.aria-expanded]="openMenu === index" [attr.aria-controls]="'nav-group-' + index"><i [class]="item.icon || 'pi pi-folder'" aria-hidden="true"></i>{{menuLabel(item.label)}}<i class="pi pi-angle-down chevron" aria-hidden="true"></i></button>
   <div *ngIf="item.items && openMenu === index" class="navigation-dropdown" [id]="'nav-group-' + index"><span class="dropdown-caption">{{menuLabel(item.label)}}</span><a *ngFor="let child of item.items" [routerLink]="child.routerLink" routerLinkActive="selected" (click)="closeMenus()"><span>{{menuLabel(child.label)}}</span><i class="pi pi-arrow-up-right" aria-hidden="true"></i></a></div>
  </li></ul></nav>
  <div class="header-tools"><span class="branch-label" *ngIf="data?.branchId?.name"><i class="pi pi-map-marker" aria-hidden="true"></i><span>{{data.branchId.name}}</span></span>
   <div class="profile-area"><button class="profile-trigger" type="button" (click)="toggleProfile()" [attr.aria-expanded]="profileOpen" aria-controls="profile-menu" aria-label="Open account menu"><span class="user-avatar" aria-hidden="true">{{(data?.name || data?.username || 'U').slice(0,1) | uppercase}}</span><span class="account-name">{{data?.name || data?.username || 'Account'}}</span><i class="pi pi-angle-down" aria-hidden="true"></i></button>
   <div *ngIf="profileOpen" class="profile-menu" id="profile-menu"><div class="profile-summary"><strong>{{data?.name || data?.username || 'Your account'}}</strong><span>{{data?.role || 'Team member'}}</span><small *ngIf="data?.branchId?.name">{{data.branchId.name}}</small></div><a *ngIf="!isCompanyAccount" [routerLink]="profileRoute" (click)="closeMenus()"><i class="pi pi-user" aria-hidden="true"></i>My profile</a><button type="button" (click)="logout()"><i class="pi pi-sign-out" aria-hidden="true"></i>Sign out</button></div></div>
   <button class="mobile-toggle" type="button" (click)="toggleMobile()" [attr.aria-expanded]="mobileOpen" aria-controls="workspace-navigation"><span>Menu</span><i [class]="mobileOpen ? 'pi pi-times' : 'pi pi-bars'" aria-hidden="true"></i></button>
  </div>
 </div>
</header>
